name: Preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A PR whose Preview deploy never finished answers "Preview not found"; any other error fails
      # the job
      - name: Delete Preview
        run: |
          if out=$(pnpm exec wrangler preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation 2>&1); then
            echo "Deleted Preview"
          elif grep -q "Preview not found" <<<"$out"; then
            echo "No Preview to delete"
          else
            echo "$out"
            exit 1
          fi

      - name: Mark PR comment as stale
        env:
          GH_TOKEN: ${{ github.token }}
        # Only PRs that got a Preview have a comment to edit
        run: gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --edit-last --body "### Preview"$'\n\n'"Deleted when this PR closed." || true
