name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# Shared with preview-cleanup.yml, so closing a PR cancels a deploy still in flight
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    # Forks don't get repository secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

      - name: Create Preview
        run: |
          # Read the URL from Wrangler's output file: --json still prints upload progress to stdout
          output="$RUNNER_TEMP/wrangler.json"
          WRANGLER_OUTPUT_FILE_PATH="$output" pnpm exec wrangler preview --name "pr-${{ github.event.pull_request.number }}"
          # A Worker's preview_urls setting only takes effect on `wrangler deploy`, so a Preview has
          # no URL until production has been deployed with it on
          url=$(jq -r 'select(.type == "preview") | .preview_urls[0] // "No URL: deploy production with preview_urls on"' "$output")
          {
            echo "### Preview"
            echo
            echo "$url"
            echo
            echo "Updated for ${{ github.event.pull_request.head.sha }}"
          } > comment.md
          cat comment.md

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file comment.md --edit-last --create-if-none
